# ==============================================================================
# 家园社区 / 二战征途 —— 统一入口 nginx 配置
#
# 部署位置：47.102.48.155（主机器）  /etc/nginx/conf.d/qqjiayuan.conf
# 前置：/etc/nginx/nginx.conf 的 http{} 里需要有 `include /etc/nginx/conf.d/*.conf;`
#
# 对外端口 → 后端真实地址
#   8080 → 127.0.0.1:18080          155 本机  家园        （主入口，玩家记这个）
#   8081 → 127.0.0.1:18081          155 本机  二战 1 区
#   8082 → 127.0.0.1:18082          155 本机  二战 2 区
#   8083 → 47.101.221.210:8080      210 机器  家园        （副入口）
#   8084 → 47.101.221.210:8081      210 机器  二战 1 区
#   8085 → 47.101.221.210:8082      210 机器  二战 2 区
#
# ★ 155 本机后端必须从 8080/8081/8082 挪到 18080/18081/18082，否则和 nginx 抢端口。
#   210 机器后端不动（保持 8080/8081/8082），由 155 的 nginx 反向代理过去。
#
# ★ 玩家只需要记两个地址：
#       http://47.102.48.155:8080     主服
#       http://47.102.48.155:8083     副服（210，随时可能下线）
#   二战端口（8081/8082/8084/8085）对玩家是隐藏的 —— 从家园「游戏大厅」点进去自动跳。
# ==============================================================================

# ------------------------------------------------------------------------------
# 后端 upstream
# max_fails/fail_timeout：连续失败 2 次就摘除 10 秒，避免 210 机器挂掉时玩家干等超时
# ------------------------------------------------------------------------------
upstream jy_home_155  { server 127.0.0.1:18080       max_fails=2 fail_timeout=10s; }
upstream jy_wwii1_155 { server 127.0.0.1:18081       max_fails=2 fail_timeout=10s; }
upstream jy_wwii2_155 { server 127.0.0.1:18082       max_fails=2 fail_timeout=10s; }
upstream jy_home_210  { server 47.101.221.210:8080   max_fails=2 fail_timeout=10s; }
upstream jy_wwii1_210 { server 47.101.221.210:8081   max_fails=2 fail_timeout=10s; }
upstream jy_wwii2_210 { server 47.101.221.210:8082   max_fails=2 fail_timeout=10s; }

# ==============================================================================
# 8080 —— 155 家园（主入口）
# ==============================================================================
server {
    listen       8080;
    server_name  _;

    client_max_body_size 20m;          # 后端 MaxMultipartMemory = 8MB，留余量
    server_tokens   off;
    proxy_redirect  off;               # ★ 后端会 302 跳二战，别让 nginx 改写 Location

    # 静态资源（web/dist 的 js/css 带 hash，可长缓存）
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;

    location / {
        proxy_pass http://jy_home_155;

        # ★★ Host 必须带端口：后端 ezfyZoneURL 靠它把 ':8081' 解析成 http://<域名>:8081
        #    写成 $proxy_host 或 127.0.0.1:18080 → 玩家会被跳到 127.0.0.1，必挂。
        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }
}

