# ==============================================================================
# 8083 —— 210 家园（副入口）
# 210 随时下线：挂了这里返 502。想更友好可把下面 location / 换成维护页。
# ==============================================================================
server {
    listen       8083;
    server_name  _;

    client_max_body_size 20m;
    server_tokens   off;
    proxy_redirect  off;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;

    location / {
        proxy_pass http://jy_home_210;

        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;      # 210 可能关机，连不上要快速失败
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }

    # 210 关机时给玩家一句人话，而不是 nginx 默认 502 页
    error_page 502 503 504 = @maintenance;
    location @maintenance {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>维护中</title><body style="font-family:sans-serif;text-align:center;padding-top:15%"><h2>该服正在维护</h2><p>请访问主服：<a href="http://47.102.48.155:8080">http://47.102.48.155:8080</a></p></body>';
    }
}

