<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>服务不可用 - 家园社区</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #eef2f8;
      color: #303133;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .box {
      width: 100%;
      max-width: 520px;
      padding: 44px 32px 36px;
      text-align: center;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 28px rgba(0, 21, 41, .08);
    }
    .code {
      font-size: 62px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 2px;
      color: #f56c6c;
    }
    .title {
      margin-top: 14px;
      font-size: 21px;
      font-weight: 600;
      color: #303133;
    }
    .sub {
      margin-top: 6px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #a8abb2;
      text-transform: uppercase;
    }
    .desc {
      margin-top: 22px;
      font-size: 14px;
      line-height: 1.9;
      color: #606266;
    }
    .tip {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.8;
      color: #909399;
    }
    .line {
      margin: 24px auto 0;
      max-width: 320px;
      border-top: 1px dashed #e4e7ed;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 30px;
      font-size: 14px;
      color: #fff;
      background: #409eff;
      border: 0;
      border-radius: 22px;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .btn:hover { background: #66b1ff; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .foot {
      margin-top: 26px;
      font-size: 12px;
      color: #c0c4cc;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">503</div>
    <div class="title">服务不可用</div>
    <div class="sub">Service Unavailable</div>
    <div class="desc">您的访问请求已被拒绝，无法继续访问本站。</div>
    <div class="tip">如认为属于误封，请联系站点管理员处理。</div>
    <div class="line"></div>
    <button class="btn" onclick="location.reload()">刷新重试</button>
    <div class="foot">家园社区</div>
  </div>
</body>
</html>
